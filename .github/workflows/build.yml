name: Build Docker Image

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ inputs.service_name }}:${{ github.sha }} \
            ./services/${{ inputs.service_name }}

      - name: Verify Image
        run: |
          docker images
