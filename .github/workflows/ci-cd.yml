name: SyntraCore CI/CD

on:
  push:
    branches:
      - master
      - uat

jobs:

  detect:

    runs-on: ubuntu-latest

    outputs:
      service_name: ${{ steps.detect.outputs.service_name }}

    steps:

      - uses: actions/checkout@v4

      - id: detect

        run: |

          SERVICE=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} \
            | grep '^services/' \
            | cut -d'/' -f2 \
            | sort -u \
            | head -1)

          echo "service_name=$SERVICE" >> $GITHUB_OUTPUT

          echo "Detected Service: $SERVICE"

  build:

    needs: detect

    uses: ./.github/workflows/build.yml

    with:
      service_name: ${{ needs.detect.outputs.service_name }}

  push:

    needs:
      - detect
      - build

    uses: ./.github/workflows/push-acr.yml

    with:
      service_name: ${{ needs.detect.outputs.service_name }}

  deploy:

    needs:
      - detect
      - push

    uses: ./.github/workflows/deploy.yml

    with:
      service_name: ${{ needs.detect.outputs.service_name }}
      environment: ${{ github.ref_name == 'master' && 'prod' || 'uat' }}
