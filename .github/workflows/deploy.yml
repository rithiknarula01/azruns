name: Deploy

on:
  workflow_call:

    inputs:

      service_name:
        required: true
        type: string

      environment:
        required: true
        type: string

jobs:

  deploy:

    runs-on: ubuntu-latest

    environment: ${{ inputs.environment }}

    steps:

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy App Service
        run: |
          az webapp config container set \
            --resource-group ${{ vars.RESOURCE_GROUP }} \
            --name app-${{ inputs.service_name }}-${{ vars.ENV_NAME }} \
            --container-image-name \
            ${{ vars.ACR_NAME }}.azurecr.io/${{ inputs.service_name }}:${{ github.sha }}
